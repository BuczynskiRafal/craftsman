<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="outer-rim-grad" x1="20" y1="11" x2="100" y2="117" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#32E392" />
      <stop offset="40%" stop-color="#2EDB93" />
      <stop offset="72%" stop-color="#20AC81" />
      <stop offset="100%" stop-color="#107C6F" />
    </linearGradient>
    <linearGradient id="inner-rim-grad" x1="27" y1="19" x2="96" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#33E597" />
      <stop offset="48%" stop-color="#28C88C" />
      <stop offset="80%" stop-color="#1B8B77" />
      <stop offset="100%" stop-color="#156762" />
    </linearGradient>
    <linearGradient id="arch1-grad" x1="40" y1="31" x2="88" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#32E392" />
      <stop offset="48%" stop-color="#30DB92" />
      <stop offset="100%" stop-color="#24B787" />
    </linearGradient>
    <linearGradient id="arch2-grad" x1="46" y1="68" x2="82" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2AD090" />
      <stop offset="50%" stop-color="#1B8674" />
      <stop offset="100%" stop-color="#136465" />
    </linearGradient>
    <linearGradient id="arch3-grad" x1="52" y1="68" x2="76" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#31D291" />
      <stop offset="48%" stop-color="#209E84" />
      <stop offset="100%" stop-color="#146468" />
    </linearGradient>
    <clipPath id="shield-outer-clip">
      <path d="M64 11.2 L108.5 27.1 V53 C108.5 76 91 101 64 116.8 C37 101 19.5 76 19.5 53 V27.1 Z" />
    </clipPath>
    <clipPath id="shield-inner-clip">
      <path d="M64 19.3 L100.9 32.4 V53 C100.9 72 86 96 64 108.7 C42 96 27.1 72 27.1 53 V32.4 Z" />
    </clipPath>
    <clipPath id="doorway-clip">
      <path d="M52.3 89 V51.7 L64 45.2 L75.7 51.7 V89 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#shield-outer-clip)">
    <rect x="0" y="0" width="128" height="128" fill="#0F1724" />
    <rect x="0" y="0" width="64" height="128" fill="#122833" />
  </g>

  <g clip-path="url(#shield-inner-clip)">
    <rect x="0" y="0" width="128" height="128" fill="#0F1724" />
    <rect x="0" y="0" width="64" height="128" fill="#10333D" />

    <!-- Floor & threshold perspective plane -->
    <path d="M46.6 91.2 L52.3 87.9 L64 82.3 V112 H46.6 Z" fill="#0F2C36" />
    <path d="M81.4 91.2 L75.7 87.9 L64 82.3 V112 H81.4 Z" fill="#0A1824" />
    <path d="M52.3 87.9 L62.8 81.8 L64 82.3 V86.2 L52.3 87.9 Z" fill="#133F47" />
    <path d="M64 82.3 L75.7 87.9 L64 86.2 Z" fill="#0E2C36" />

    <!-- Dark doorway void behind open door -->
    <path d="M64 45.2 L75.7 51.7 V87.9 L62.8 81.8 H52.3 V51.7 Z" fill="#0E1824" />

    <!-- Open door leaf fill -->
    <path d="M52.3 51.7 L62.8 57.2 V81.8 L52.3 87.9 Z" fill="#114B53" />
    <!-- Open door leaf frame (clipped inside Arch 3 so nothing protrudes past the jamb) -->
    <path
      clip-path="url(#doorway-clip)"
      d="M51.5 51.3 L62.8 57.2 V81.8 L51.5 88.4"
      stroke="#31D291"
      stroke-width="2.2"
      stroke-linejoin="miter"
      fill="none"
    />
    <circle cx="59.0" cy="68.8" r="1.45" fill="#2EDB93" />

    <!-- Arch 3 (inner doorway frame + collinear baseboard lines into Arch 2) -->
    <path
      d="M46.6 91.2 L52.3 87.9 V51.7 L64 45.2 L75.7 51.7 V87.9 L81.4 91.2"
      stroke="url(#arch3-grad)"
      stroke-width="2.2"
      stroke-linejoin="miter"
    />
    <!-- Arch 2 (middle peaked gate, drawn over Arch 3 baseboards for flush joints) -->
    <path
      d="M46.6 102 V48.1 L64 38.7 L81.4 48.1 V102"
      stroke="url(#arch2-grad)"
      stroke-width="2.2"
      stroke-linejoin="miter"
    />
    <!-- Arch 1 (outermost peaked gate, meets inner shield rim) -->
    <path
      d="M40.9 96 V44.3 L64 32.0 L87.1 44.3 V96"
      stroke="url(#arch1-grad)"
      stroke-width="2.5"
      stroke-linejoin="miter"
    />
  </g>

  <path
    d="M64 19.3 L100.9 32.4 V53 C100.9 72 86 96 64 108.7 C42 96 27.1 72 27.1 53 V32.4 Z"
    stroke="url(#inner-rim-grad)"
    stroke-width="2.4"
    stroke-linejoin="miter"
    fill="none"
  />
  <path
    d="M64 11.2 L108.5 27.1 V53 C108.5 76 91 101 64 116.8 C37 101 19.5 76 19.5 53 V27.1 Z"
    stroke="url(#outer-rim-grad)"
    stroke-width="2.9"
    stroke-linejoin="miter"
    fill="none"
  />
</svg>
