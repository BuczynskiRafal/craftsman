name: Benchmark Replication
description: Share empirical replication results for Craftsman vs. baseline
title: "[Benchmark Replication]: "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for replicating the Craftsman empirical benchmarks! Please share your experimental setup, configuration, and results below.

  - type: input
    id: agent-setup
    attributes:
      label: Model & Platform
      description: e.g. Claude Sonnet 5.5 (Claude Code), Gemini 3.8 Flash (Antigravity), Copilot CLI, Codex CLI
      placeholder: Gemini 3.8 Flash (low), Antigravity CLI (agy -p)
    validations:
      required: true

  - type: dropdown
    id: benchmark-suite
    attributes:
      label: Benchmark Suite
      description: Which benchmark dataset did you evaluate?
      options:
        - Seeded Defect Suite (evals/)
        - SWR-Bench
        - Custom Project / Repository
      default: 0
    validations:
      required: true

  - type: input
    id: repetitions
    attributes:
      label: Repetition Count (n)
      description: Number of repetitions per configuration
      placeholder: "3"
    validations:
      required: true

  - type: textarea
    id: results-table
    attributes:
      label: Evaluation Results Table
      description: Report defect recall, precision, duration, and cost or token usage comparison between baseline and Craftsman.
      placeholder: |
        | Configuration | Defect Recall | Precision | Duration (min/pass) | Cost / Tokens |
        | :--- | :--- | :--- | :--- | :--- |
        | Baseline | 15/27 (56%) | 85% | 12.0 min | $0.45 / 2.5M |
        | Craftsman | 26/27 (96%) | 75% | 17.3 min | $2.58 / 30M |
    validations:
      required: true

  - type: textarea
    id: findings-link
    attributes:
      label: Findings Dump / Transcript Link
      description: Provide a link to the raw session ledger, transcript, or PR artifact proving the findings.
      placeholder: https://gist.github.com/...
    validations:
      required: false
