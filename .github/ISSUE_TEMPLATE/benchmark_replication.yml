name: Benchmark Replication
description: Share empirical replication results for Craftsman vs. baseline
title: "[Benchmark Replication]: "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for replicating the Craftsman empirical benchmarks! Please share your setup, model, repetition count, and measurements below.

  - type: input
    id: agent-setup
    attributes:
      label: Model & Platform
      description: e.g. Gemini 3.8 Flash (Antigravity CLI), Claude Sonnet (Claude Code), Copilot CLI, Codex CLI
      placeholder: Gemini 3.8 Flash (low), Antigravity CLI (agy -p)
    validations:
      required: true

  - type: dropdown
    id: benchmark-suite
    attributes:
      label: Benchmark Suite
      description: Which benchmark dataset did you evaluate?
      options:
        - Seeded Defect Suite (evals/)
        - Build-and-Verify Suite (evals/build_cases/)
        - Custom Project / Repository
      default: 0
    validations:
      required: true

  - type: input
    id: repetitions
    attributes:
      label: Repetition Count (n)
      description: Number of complete passes per arm
      placeholder: "3"
    validations:
      required: true

  - type: textarea
    id: results-table
    attributes:
      label: Evaluation Results Table
      description: Report recall, precision, duration, and cost or token usage for baseline vs. Craftsman.
      placeholder: |
        | Configuration | Recall | Precision | Duration / pass | Tokens / Cost per pass |
        | :--- | :--- | :--- | :--- | :--- |
        | Baseline | 24.00/27 (89%) | 100% | 11.9 min | 3.3M tokens |
        | Craftsman 5.2.0 | 26.50/27 (98%) | 84% | 142.7 min | 86.6M tokens |
      validations:
      required: true

  - type: textarea
    id: findings-link
    attributes:
      label: Findings Dump / Transcript Link
      description: Optional link to raw JSONL results, breakdown output, or transcript logs.
      placeholder: https://gist.github.com/...
    validations:
      required: false
