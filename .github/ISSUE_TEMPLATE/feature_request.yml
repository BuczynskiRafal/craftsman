name: Feature Request
description: Suggest an idea or enhancement for Craftsman
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement for Craftsman!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe clearly.
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see.
      placeholder: Introduce a new review lens / CLI flag / platform adapter...
    validations:
      required: true

  - type: textarea
    id: proposed-syntax
    attributes:
      label: Proposed CLI / Skill Syntax
      description: If applicable, illustrate how the CLI, skill, or hook should be invoked.
      placeholder: |
        craftsman review ...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you have considered.
    validations:
      required: false
