name: Release & Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-verify-publish:
    name: Build, Verify and Publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/craftsman-gate/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION=$(python3 -c "import craftsman; print(craftsman.__version__)")
          echo "Tag version: ${TAG_VERSION}, Package version: ${PACKAGE_VERSION}"
          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "Error: Tag version v${TAG_VERSION} does not match craftsman.__version__ ${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Wheel smoke test in clean virtualenv
        run: |
          python -m venv test_env
          test_env/bin/pip install dist/*.whl
          test_env/bin/craftsman doctor
          test_env/bin/craftsman doctor --json
          test_env/bin/craftsman install --all --dry-run
          test_env/bin/craftsman skill list
          test_env/bin/craftsman export --repo-dir . --plugins --check

      - name: Extract release notes from CHANGELOG.md
        id: release_notes
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          python3 -c "
          import re, sys
          from pathlib import Path
          content = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = rf'## \[{re.escape(sys.argv[1])}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              Path('RELEASE_NOTES.md').write_text(match.group(1).strip() + '\n', encoding='utf-8')
          else:
              Path('RELEASE_NOTES.md').write_text(f'Release {sys.argv[1]}\n', encoding='utf-8')
          " "${TAG_VERSION}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
