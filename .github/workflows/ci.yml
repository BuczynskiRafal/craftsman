name: CI

on:
  push:
    branches: [main, devel, "release/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, devel]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and static analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check craftsman scripts tests

      - name: Typecheck with Mypy (strict)
        run: mypy --strict craftsman scripts tests

      - name: Run unit and behavioral test suite
        run: python -m unittest discover -s tests -v

      - name: Run CLI Doctor & Multi-Platform Installer Smoke Test
        run: |
          craftsman doctor
          craftsman doctor --json
          TMP_HOME="$(mktemp -d)"
          HOME="${TMP_HOME}" git config --global user.name "Test Engineer"
          HOME="${TMP_HOME}" git config --global user.email "engineer@example.com"
          HOME="${TMP_HOME}" ./install.sh --all
          test -f "${TMP_HOME}/.gemini/config/skills/craftsman/SKILL.md"
          test -f "${TMP_HOME}/.claude/commands/craftsman.md"
          test -f "${TMP_HOME}/.claude/rules/craftsman-rules.md"
          test -x "${TMP_HOME}/.gemini/config/scripts/craftsman-scope-guard.py"
          test -x "${TMP_HOME}/.gemini/config/scripts/craftsman-stop-gate.py"
          rm -rf "${TMP_HOME}"

  windows-gate:
    name: Quality Gate (windows-latest, Python 3.12)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and static analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check craftsman scripts tests

      - name: Typecheck with Mypy (strict)
        run: python -m mypy --strict craftsman scripts tests

      - name: Run unit and behavioral test suite
        run: python -m unittest discover -s tests -v

      - name: Run CLI Doctor
        run: |
          craftsman doctor
          craftsman doctor --json

      - name: Run installer dry run
        run: craftsman install --all --dry-run

  packaging-smoke-test:
    name: Distribution Packaging Smoke Test (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Wheel smoke test in clean virtualenv
        run: |
          python -m venv test_env
          test_env/bin/pip install dist/*.whl
          test_env/bin/craftsman doctor
          test_env/bin/craftsman doctor --json
          test_env/bin/craftsman install --all --dry-run
          test_env/bin/craftsman skill list
          test_env/bin/craftsman export --repo-dir . --plugins --check
