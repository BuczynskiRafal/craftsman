name: CI

on:
  push:
    branches: [main, "release/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and static analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check craftsman scripts tests

      - name: Typecheck with Mypy (strict)
        run: mypy --strict craftsman scripts tests

      - name: Run unit and behavioral test suite
        run: python -m unittest discover -s tests -v

      - name: Run CLI Doctor & Multi-Platform Installer Smoke Test
        run: |
          craftsman doctor
          craftsman doctor --json
          TMP_HOME="$(mktemp -d)"
          HOME="${TMP_HOME}" git config --global user.name "Test Engineer"
          HOME="${TMP_HOME}" git config --global user.email "engineer@example.com"
          HOME="${TMP_HOME}" ./install.sh --all
          test -f "${TMP_HOME}/.gemini/config/skills/craftsman/SKILL.md"
          test -f "${TMP_HOME}/.claude/commands/craftsman.md"
          test -f "${TMP_HOME}/.claude/rules/craftsman-rules.md"
          test -x "${TMP_HOME}/.gemini/config/git-hooks/commit-msg"
          test -x "${TMP_HOME}/.gemini/config/git-hooks/pre-push"
          rm -rf "${TMP_HOME}"
